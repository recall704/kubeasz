- name: 尝试推送离线kuboard镜像（若执行失败，可忽略）
  copy: src={{ base_dir }}/down/{{ kuboard_offline }} dest=/opt/kube/images/{{ kuboard_offline }}
  when: 'kuboard_offline in download_info.stdout'
  ignore_errors: true

- name: 获取kuboard离线镜像推送情况
  command: "ls /opt/kube/images"
  register: image_info

- name: 导入kuboard的离线镜像（若执行失败，可忽略）
  shell: "{{ bin_dir }}/docker load -i /opt/kube/images/{{ kuboard_offline }}"
  when: 'kuboard_offline in image_info.stdout and CONTAINER_RUNTIME == "docker"'
  ignore_errors: true

- name: 导入kuboard的离线镜像（若执行失败，可忽略）
  shell: "{{ bin_dir }}/ctr -n=k8s.io images import /opt/kube/images/{{ kuboard_offline }}"
  when: 'kuboard_offline in image_info.stdout and CONTAINER_RUNTIME == "containerd"'
  ignore_errors: true


# 在 kube_master 0 上创建目录 /app/kuboard
- name: 创建 kuboard 的数据目录
  file:
    path: /app/kuboard
    state: directory
  delegate_to: "{{ groups['kube_master'][0] }}"
  run_once: true

# 在 kube_master 0 上执行 template 模块
- name: 准备 kuboard 的配置文件
  template: src=kuboard/docker-compose.yaml.j2 dest=/app/kuboard/docker-compose.yaml
  delegate_to: "{{ groups['kube_master'][0] }}"
  run_once: true

# 在 kube_master 0 上启动 kuboard
- name: 启动 kuboard
  command: "{{ bin_dir }}/docker-compose -f /app/kuboard/docker-compose.yaml up -d"
  delegate_to: "{{ groups['kube_master'][0] }}"
  run_once: true
